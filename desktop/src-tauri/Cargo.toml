[package]
name = "biozar-desktop"
version = "1.2.0"
description = "BIOZAR — Console de Pilotage (semi-offline)"
authors = ["BIOZAR Madagascar"]
edition = "2021"
rust-version = "1.77"

# Le binaire ne doit pas ouvrir de console Windows en release.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "biozar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
